<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Scene — Walkable WebGL2</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<canvas id="glcanvas"></canvas>
<div id="info"><b>Position:</b> <span id="position">0, 0, 0</span><br><b>FPS:</b> <span id="fps">0</span></div>
<div id="controls"><b>Controls</b><br>W/A/S/D or Arrows — Move<br>Mouse — Look (click to lock)<br>Space — Jump<br>Shift — Sprint<br>C — Toggle collider view<br>Esc — Release mouse</div>
<div id="status">Loading model…</div>
<div id="colliderhint" style="display:none"></div>
<div id="crosshair"></div>
<div id="lockhint">Click to walk around</div>

<script src="modelData.js"></script>
<script src="renderer.js"></script>
<script src="player.js"></script>
<script src="main.js"></script>
</body>
</html>
